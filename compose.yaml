# Démo M2 : `docker compose up` lance la tranche complète, de l'écran aux
# données (ADR 0006). Interface sur http://localhost:8080.
# Versions figées. Aucune variable à fournir : les valeurs par défaut sont des
# valeurs de démo, pas des secrets.
name: hackathon

services:
  # Le poste de travail : VS Code s'y attache, on y lance l'API et le front.
  # Profil « dev » : démarré par le Dev Container, pas par `docker compose up`.
  dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    extra_hosts:
      # Rend l'hôte joignable sous Linux (Docker Desktop le fait déjà)
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # Les données, dans un volume Docker : `docker compose down -v` repart de zéro
      - db-data:/var/lib/postgresql/data
      # Schéma et données de démo, joués au premier démarrage
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # Le LLM local. Les modèles sont gardés dans un volume entre deux lancements.
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      # Modèle gardé en mémoire une fois chargé : pas de chargement à froid
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

  # Service IA de l'équipe Data/IA (ia/main.py) : rédige les fiches prospect.
  # Il télécharge lui-même le modèle s'il manque (environ 2 Go au premier
  # lancement, avec reprise en cas d'erreur), puis le charge en mémoire.
  # L'interface marche pendant ce temps et affiche la progression.
  ia:
    build: ia
    environment:
      API_KEY: ${IA_API_KEY:-demo-cle-locale}
      OLLAMA_URL: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      FICHE_TIMEOUT: 100
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      IA_URL: http://ia:8000
      IA_API_KEY: ${IA_API_KEY:-demo-cle-locale}
      FICHE_TIMEOUT_MS: 110000
      # Page /questions : même LLM local, au format OpenAI
      AI_BASE_URL: http://ollama:11434/v1
      AI_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      db:
        condition: service_healthy
      ia:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - ${WEB_PORT:-8080}:80
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  ollama-models:
