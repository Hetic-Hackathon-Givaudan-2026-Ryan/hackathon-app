# Front de la démo : les fichiers du build Vite, et /api transmis à l'API
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        # La régénération d'une fiche par le LLM local peut prendre 2 min
        proxy_read_timeout 150s;
    }

    # Fichiers du build, nommés d'après leur contenu : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : /prospects/... renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
